name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - "RoboLotofacil/main.py"
      - "RoboLotofacil/lotofacil_pkg/**"
      - "RoboLotofacil/plugins/**"
      - "RoboLotofacil/config_v22.yaml"
      - ".github/workflows/build-windows-exe.yml"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: RoboLotofacil
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pandas requests pyyaml reportlab pyinstaller

      - name: Compilar executável
        run: >
          pyinstaller --onefile --windowed
          --name RoboLotofacilPro
          --add-data "plugins;plugins"
          --add-data "config_v22.yaml;."
          main.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: RoboLotofacilPro-windows
          path: RoboLotofacil/dist/RoboLotofacilPro.exe
